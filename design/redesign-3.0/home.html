<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>咻咿提取 · 首页（原布局 + 新素材）</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    background: #DFE2DE;
    color: #192F37;
    -webkit-font-smoothing: antialiased;
  }

  .screen {
    width: 390px;
    height: 844px;
    background: #F7F8F6;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .statusbar {
    height: 44px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    font-size: 13px;
    font-weight: 700;
    color: #192F37;
  }
  .statusbar .icons { display: flex; align-items: center; gap: 6px; }

  .page {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    padding: 20px 18px 32px;
  }

  /* ---------- 顶部主视觉卡（保持 212dp） ---------- */
  .hero {
    height: 212px;
    background: #FFFFFF;
    border-radius: 26px;
    overflow: hidden;
    display: flex;
    align-items: center;
  }
  .hero > img {
    width: 50%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .hero-words {
    width: 50%;
    padding: 0 10px 0 4px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
  }
  .tag {
    font-size: 10px;
    font-weight: 700;
    color: #1C9E78;
    background: #EBF8F1;
    border-radius: 12px;
    padding: 5px 7px;
    white-space: nowrap;
  }
  .hero h1 {
    margin: 12px 0 0;
    font-size: 31px;
    line-height: 1.25;
    font-weight: 700;
    color: #5E69E8;
    letter-spacing: .5px;
  }
  .hero p {
    margin: 8px 0 0;
    font-size: 11px;
    line-height: 1.6;
    color: #7D8F8F;
  }

  /* ---------- 选择功能 ---------- */
  .section-title {
    margin: 28px 0 0;
    font-size: 20px;
    font-weight: 700;
    color: #192F37;
  }
  .section-desc {
    margin: 3px 0 18px;
    font-size: 12px;
    color: #7D8F8F;
  }

  .features { display: flex; gap: 18px; }
  .feature {
    flex: 1;
    height: 178px;
    border-radius: 24px;
    padding: 14px 14px 12px 16px;
    display: flex;
    flex-direction: column;
  }
  .feature.douyin { background: #E8E9FF; }
  .feature.xhs { background: #FFECE8; }
  .feature img { width: 64px; height: 64px; display: block; }
  .feature b { margin-top: 6px; font-size: 16px; font-weight: 700; }
  .feature small { margin-top: 3px; font-size: 11px; color: #7D8F8F; }
  .feature .arrow {
    margin-top: auto;
    align-self: flex-end;
    width: 42px;
    height: 27px;
    border-radius: 18px;
    background: #FFFFFF;
    display: grid;
    place-items: center;
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
  }

  /* ---------- 底部导航（保持 96dp + 悬浮首页） ---------- */
  .nav-area {
    height: 96px;
    flex: none;
    position: relative;
  }
  .dock {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 74px;
    background: #FFFFFF;
    border-radius: 26px;
    display: flex;
    align-items: center;
    padding: 9px 18px 0;
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .nav-item img { width: 27px; height: 27px; display: block; }
  .nav-item .gear { font-size: 26px; line-height: 27px; color: #7D8F8F; }
  .nav-item span { font-size: 12px; font-weight: 700; color: #7D8F8F; }
  .nav-spacer { flex: 1; }

  .fab {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 72px;
    height: 72px;
    display: block;
    filter: drop-shadow(0 5px 10px rgba(94, 105, 232, .35));
  }
  .fab-label {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 28px;
    line-height: 28px;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #5E69E8;
  }
</style>
</head>
<body>
<div class="screen">
  <div class="statusbar">
    <span>9:41</span>
    <span class="icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 3.6a10 10 0 0 1 14 0"/><path d="M3.6 6.2a6.4 6.4 0 0 1 8.8 0"/><circle cx="8" cy="9.3" r="1" fill="currentColor" stroke="none"/></svg>
      <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="14" height="7" rx="1.8" fill="currentColor"/><path d="M22.5 4v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".4"/></svg>
    </span>
  </div>

  <main class="page">
    <section class="hero">
      <img src="png/hero.png" alt="">
      <div class="hero-words">
        <span class="tag">● 评论表情收藏夹</span>
        <h1>咻咿<br>提取</h1>
        <p>评论素材提取<br>预览后再保存</p>
      </div>
    </section>

    <h2 class="section-title">选择功能</h2>
    <p class="section-desc">从你想读取的平台开始</p>

    <div class="features">
      <div class="feature douyin">
        <img src="png/douyin-feature.png" alt="">
        <b>抖音链接读取</b>
        <small>表情包 · 图片 · GIF</small>
        <span class="arrow" style="color:#5E69E8">→</span>
      </div>
      <div class="feature xhs">
        <img src="png/xhs-feature.png" alt="">
        <b>小红书链接读取</b>
        <small>图片 · 回复 · 实况</small>
        <span class="arrow" style="color:#F37D6A">→</span>
      </div>
    </div>
  </main>

  <div class="nav-area">
    <div class="dock">
      <div class="nav-item">
        <img src="png/douyin-nav.png" alt="">
        <span>抖音</span>
      </div>
      <div class="nav-spacer"></div>
      <div class="nav-item">
        <span class="gear">⚙</span>
        <span>设置</span>
      </div>
    </div>
    <img class="fab" src="png/home-nav.png" alt="">
    <span class="fab-label">首页</span>
  </div>
</div>

<script src="probe.js"></script>
</body>
</html>
