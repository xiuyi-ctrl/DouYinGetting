plugins { id 'com.android.application' }

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}

android {
    namespace 'com.example.douyingetting'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.douyingetting'
        minSdk 29
        targetSdk 35
        versionCode 45
        versionName '3.1.7'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
